<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 Bilimdon bolajon</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#74ebd5,#ACB6E5);min-height:100vh}
header{text-align:center;color:white;padding:25px 10px}
header h1{font-size:40px;margin:5px}
header p{font-size:18px}
.info-box{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.info{background:white;color:#333;padding:12px 20px;border-radius:20px;font-weight:bold;box-shadow:0 4px 10px #777}
.container{max-width:850px;margin:20px auto;padding:15px}
.card,.creator{background:white;padding:30px;border-radius:25px;text-align:center;box-shadow:0 8px 20px #777;margin-bottom:20px}
.level{color:#6c5ce7;font-size:22px;font-weight:bold}
.stars{font-size:38px;margin:15px}
.progress{width:100%;height:20px;background:#ddd;border-radius:20px;overflow:hidden}
.progress-bar{width:0%;height:100%;background:#00b894;transition:.5s}
h2{color:#ff6b6b;font-size:28px}
.question{font-size:23px;line-height:1.5;font-weight:bold}
input,textarea{width:85%;padding:14px;border:3px solid #74b9ff;border-radius:15px;font-size:18px;margin:8px}
textarea{height:90px;resize:vertical}
button{border:none;padding:14px 25px;border-radius:20px;color:white;font-size:18px;cursor:pointer;margin:5px}
button:hover{transform:scale(1.05)}
.check{background:#00b894}
.next{background:#0984e3;display:none}
.create{background:#6c5ce7}
.add{background:#e17055}
.result{min-height:35px;margin:15px;font-size:20px;font-weight:bold}
.custom-list{text-align:left;max-height:220px;overflow:auto;margin-top:15px}
.custom-item{background:#f1f2f6;padding:10px;border-radius:12px;margin:7px 0}
.hidden{display:none}
footer{text-align:center;color:white;padding:25px}
.small{font-size:14px;color:#666}
@media(max-width:600px){header h1{font-size:30px}.card,.creator{padding:20px}.question{font-size:20px}input,textarea{width:100%;margin:8px 0}}
</style>
</head>
<body>
<header>
<h1>🌈 Bilimdon bolajon 🌈</h1>
<p>O‘yna 🎮 — Masala yech 🧮 — Yulduzcha ol ⭐</p>
<div class="info-box">
<div class="info">⭐ Ball: <span id="score">0</span></div>
<div class="info">🏆 Daraja: <span id="level">1</span></div>
<div class="info">🎯 Masala: <span id="number">1</span>/<span id="total">100</span></div>
</div>
</header>

<div class="container">
<div class="card">
<div class="level">🌟 Masalalar 🌟</div>
<div class="stars" id="stars">☆☆☆☆☆</div>
<div class="progress"><div class="progress-bar" id="progress"></div></div>
<h2>🧠 Masalani yeching!</h2>
<p class="question" id="question"></p>
<input type="number" id="answer" placeholder="Javobni yozing">
<br>
<button class="check" onclick="checkAnswer()">✅ Tekshirish</button>
<button class="next" id="nextButton" onclick="nextQuestion()">➡️ Keyingi masala</button>
<div class="result" id="result"></div>
<button class="create" onclick="toggleCreator()">✏️ Men ham masala tuzaman</button>
</div>

<div class="creator hidden" id="creator">
<h2>✏️ O‘zingiz masala tuzing</h2>
<p class="small">Masala matnini va to‘g‘ri javobini kiriting.</p>
<textarea id="newQuestion" placeholder="Masalan: Anvarda 7 ta olma bor edi. U yana 5 ta oldi. Jami nechta?"></textarea>
<br>
<input type="number" id="newAnswer" placeholder="To‘g‘ri javob">
<br>
<button class="add" onclick="addQuestion()">➕ Masalani qo‘shish</button>
<div class="result" id="createResult"></div>
<div class="custom-list" id="customList"></div>
</div>
</div>

<footer>📚 Bilimdon bolajon © 2026</footer>

    { text: 'Sinfda 25 o‘quvchi bor edi. 3 o‘quvchi chiqib ketdi. Nechta o‘quvchi qoldi?', answer: 22 },

    { text: '72 ÷ 8 nechaga teng?', answer: 9 },
    { text: 'Zuhro 14 ta gul terdi. Akasi yana 9 ta gul terdi. Jami nechta gul bo‘ldi?', answer: 23 },
    { text: 'Do‘konda 60 ta daftar bor edi. 24 tasi sotildi. Nechta daftar qoldi?', answer: 36 },
    { text: 'Har bir qatorda 5 tadan stul bor. 7 qatorda nechta stul bor?', answer: 35 },
    { text: '40 ta qalam 8 o‘quvchiga teng taqsimlandi. Har biriga nechta qalam?', answer: 5 },
    { text: 'Sardorda 27 ta yong‘oq bor edi. 11 tasini do‘stiga berdi. Nechta qoldi?', answer: 16 },
    { text: 'Bog‘bon 18 ta gul ekdi. Ertasi yana 12 ta ekdi. Jami nechta gul ekildi?', answer: 30 },
    { text: '6 ta qutining har birida 9 tadan shar bor. Jami nechta shar?', answer: 54 },
    { text: '56 ta olma 7 ta savatga teng solindi. Har bir savatda nechta olma?', answer: 8 },
    { text: 'Aziza 35 bet kitob o‘qidi. Keyin yana 20 bet o‘qidi. Jami nechta bet?', answer: 55 },
    { text: 'Maktabda 80 ta stul bor edi. 18 tasi boshqa xonaga olib ketildi. Nechta stul qoldi?', answer: 62 }
];

let customQuestions = JSON.parse(localStorage.getItem("bilimdonCustomQuestions") || "[]");
let questions = [...defaultQuestions, ...customQuestions];
let current = 0;
let score = 0;
let answered = false;

function refreshTotal() {
    document.getElementById("total").textContent = questions.length;
}

function loadQuestion() {
    refreshTotal();
    document.getElementById("question").textContent = questions[current].text;
    document.getElementById("number").textContent = current + 1;
    document.getElementById("answer").value = "";
    document.getElementById("result").textContent = "";
    document.getElementById("nextButton").style.display = "none";
    document.querySelector(".check").style.display = "inline-block";
    document.getElementById("answer").style.display = "inline-block";
    answered = false;
    document.getElementById("progress").style.width =
        (current / questions.length) * 100 + "%";
    document.getElementById("level").textContent =
        Math.floor(current / 10) + 1;
    updateStars();
}

function checkAnswer() {
    if (answered) return;

    const input = document.getElementById("answer");
    const result = document.getElementById("result");

    if (input.value === "") {
        result.textContent = "✍️ Avval javobingizni yozing!";
        result.style.color = "orange";
        return;
    }

    if (Number(input.value) === questions[current].answer) {
        result.textContent = "🎉 Barakalla! To‘g‘ri javob! +10 ball";
        result.style.color = "green";
        score += 10;
        document.getElementById("score").textContent = score;
        answered = true;
        document.querySelector(".check").style.display = "none";
        document.getElementById("nextButton").style.display = "inline-block";
        updateStars();
    } else {
        result.textContent = "❌ Xato! Yana bir bor urinib ko‘ring.";
        result.style.color = "red";
    }
}

function nextQuestion() {
    current++;

    if (current >= questions.length) {
        document.getElementById("question").textContent =
            "🎊 Tabriklaymiz! Barcha masalalarni tugatdingiz!";
        document.getElementById("answer").style.display = "none";
        document.querySelector(".check").style.display = "none";
        document.getElementById("nextButton").style.display = "none";
        document.getElementById("result").textContent =
            "🏆 Siz " + score + " ball to‘pladingiz!";
        document.getElementById("result").style.color = "#6c5ce7";
        document.getElementById("progress").style.width = "100%";
        document.getElementById("stars").textContent = "⭐⭐⭐⭐⭐";
        return;
    }
    loadQuestion();
}

function updateStars() {
    const count = Math.min(5, Math.floor(score / 50));
    document.getElementById("stars").textContent =
        "⭐".repeat(count) + "☆".repeat(5 - count);
}

function toggleCreator() {
    document.getElementById("creator").classList.toggle("hidden");
    showCustomQuestions();
}

function addQuestion() {
    const text = document.getElementById("newQuestion").value.trim();
    const answer = document.getElementById("newAnswer").value;
    const msg = document.getElementById("createResult");

    if (!text || answer === "") {
        msg.textContent = "✍️ Masala va javobni kiriting.";
        msg.style.color = "red";
        return;
    }

    customQuestions.push({text: text, answer: Number(answer)});
    localStorage.setItem(
        "bilimdonCustomQuestions",
        JSON.stringify(customQuestions)
    );

    questions = [...defaultQuestions, ...customQuestions];

    document.getElementById("newQuestion").value = "";
    document.getElementById("newAnswer").value = "";

    msg.textContent = "🎉 Masala qo‘shildi! Endi u saytda ishlatiladi.";
    msg.style.color = "green";

    showCustomQuestions();
    refreshTotal();
}

function showCustomQuestions() {
    const list = document.getElementById("customList");

    if (customQuestions.length === 0) {
        list.innerHTML = "<p>Hali o‘zingiz tuzgan masalalar yo‘q.</p>";
        return;
    }

    list.innerHTML = "<b>📝 Siz tuzgan masalalar:</b>" +
        customQuestions.map((q, i) =>
            '<div class="custom-item">' + (i + 1) + ". " +
            escapeHtml(q.text) + "</div>"
        ).join("");
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

document.getElementById("answer").addEventListener("keydown", function(event) {
    if (event.key === "Enter") checkAnswer();
});

refreshTotal();
showCustomQuestions();
loadQuestion();
</script>
</body>
</html>
